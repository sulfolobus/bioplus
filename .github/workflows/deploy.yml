name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建检查（PR 和 push 都运行）
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Chinese version (strict mode)
        run: mkdocs build -f mkdocs.yml --strict

      - name: Build English version (strict mode)
        run: mkdocs build -f mkdocs-en.yml --strict

      - name: Verify output
        run: |
          echo "=== Chinese site pages ==="
          find site -name "*.html" | wc -l
          echo "=== English site pages ==="
          find site/en -name "*.html" | wc -l
          echo "=== Check 404 page exists ==="
          test -f site/404.html && echo "✓ 404.html exists" || echo "✗ 404.html missing"
          echo "=== Check sitemap exists ==="
          test -f site/sitemap.xml && echo "✓ sitemap.xml exists" || echo "✗ sitemap.xml missing"
          test -f site/en/sitemap.xml && echo "✓ en/sitemap.xml exists" || echo "✗ en/sitemap.xml missing"
          echo "=== Check robots.txt ==="
          test -f site/robots.txt && echo "✓ robots.txt exists" || echo "✗ robots.txt missing"

  # 部署（仅 main 分支 push）
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Chinese version
        run: |
          mkdocs build -f mkdocs.yml
          mv site site_zh

      - name: Build English version
        run: |
          mkdocs build -f mkdocs-en.yml
          mv site site_en

      - name: Combine sites
        run: |
          mkdir -p site
          cp -r site_zh/* site/
          cp -r site_en/* site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
